name: Build Story Dialogue APK

on:
  push:
    branches: [main]
    paths:
      - "story-app/android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "story-app/android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: story-app/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: story-dialogue-debug-apk
          path: story-app/android/app/build/outputs/apk/debug/app-debug.apk
